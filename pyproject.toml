[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-recommendation-engine"
version = "0.1.0"
description = "An end-to-end anime recommendation system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
data = ["pandas>=2.2,<3", "requests>=2.32,<3", "pyarrow>=18,<24"]
ml = ["scipy>=1.13,<2"]
models = ["implicit==0.7.3", "threadpoolctl>=3,<4", "numpy>=1.26,<3"]
research = [
    "matplotlib>=3.9,<4",
    "requests>=2.32,<3",
    "pandas>=2.2,<3",
    "python-dotenv>=1,<2",
    "jupyterlab>=4,<5",
    "nbclient>=0.10,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
